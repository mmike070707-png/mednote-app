<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="MedNote - Clinical Shorthand Expansion, Shared Team Communication, and Hands-on Training System." />
  <title>MedNote - Clinical Portal & Shorthand Hub</title>
  
  <link rel="manifest" id="manifest-placeholder" />
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)" />
  <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap)" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased select-none">

  <div id="app" class="flex-grow flex flex-col"></div>

  <script>
    const manifestData = {
      "name": "MedNote Clinical Hub",
      "short_name": "MedNote",
      "description": "Clinical Shorthand Expansion & Team Communication App",
      "start_url": "/",
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#2563eb",
      "icons": [
        {
          "src": "[https://cdn-icons-png.flaticon.com/512/3063/3063176.png](https://cdn-icons-png.flaticon.com/512/3063/3063176.png)",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "[https://cdn-icons-png.flaticon.com/512/3063/3063176.png](https://cdn-icons-png.flaticon.com/512/3063/3063176.png)",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blobManifest = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blobManifest);
    document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);

    const DEFAULT_DICT = {
      "pt": "patient",
      "htn": "hypertension",
      "dm2": "type 2 diabetes mellitus",
      "dm1": "type 1 diabetes mellitus",
      "sob": "shortness of breath",
      "po": "orally (by mouth)",
      "bid": "twice a day",
      "tid": "three times a day",
      "qid": "four times a day",
      "qd": "once daily",
      "prn": "as needed",
      "ekg": "electrocardiogram",
      "chf": "congestive heart failure",
      "copd": "chronic obstructive pulmonary disease",
      "rx": "prescription",
      "dx": "diagnosis",
      "hx": "history",
      "tx": "treatment",
      "stat": "immediately",
      "bp": "blood pressure",
      "hr": "heart rate",
      "icu": "intensive care unit",
      "er": "emergency room",
      "iv": "intravenous",
      "npo": "nothing by mouth"
    };

    let state = {
      currentUser: null,
      activeTab: 'workspace',
      dictionary: { ...DEFAULT_DICT },
      notesHistory: [
        { id: 1, original: "72yo pt presenting to ER w/ sob, htn, and hx of chf. Start IV prn.", expanded: "72yo patient presenting to emergency room w/ shortness of breath, hypertension, and history of congestive heart failure. Start intravenous as needed.", timestamp: "10:15 AM", author: "Dr. Alex Vance" },
        { id: 2, original: "Administer rx po bid for dm2. Monitor bp stat.", expanded: "Administer prescription orally (by mouth) twice a day for type 2 diabetes mellitus. Monitor blood pressure immediately.", timestamp: "11:30 AM", author: "Nurse Sarah Jenkins" }
      ],
      chatMessages: [
        {
          id: 101,
          author: "Dr. Eleanor Vance (Director)",
          role: "admin",
          text: "Attention team: 72yo pt in Bed 4 presenting w/ severe sob & htn. Please run ekg stat.",
          timestamp: "12:04 PM"
        },
        {
          id: 102,
          author: "Sam Martinez, RN",
          role: "employee",
          text: "Copy Dr. Vance. Starting IV and administering rx po bid prn. Will monitor bp closely.",
          timestamp: "12:07 PM"
        }
      ],
      tutorialStep: 0
    };

    const TUTORIAL_STEPS = [
      {
        title: "Welcome to MedNote!",
        description: "MedNote streamlines clinical documentation by instantly expanding standardized medical shorthand and abbreviations into clear, full text.",
        instruction: "Click 'Next' below to begin your walkthrough."
      },
      {
        title: "1. Basic Shorthand Expansion",
        description: "Type a short phrase using medical abbreviations. Try typing: <code class='bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-mono text-sm'>pt with htn and dm2</code>",
        instruction: "Type the phrase into the workspace and press Expand."
      },
      {
        title: "2. Shared Team Channel",
        description: "Communicate in real time with doctors and nurses using shorthand in the Team Channel.",
        instruction: "Switch to the 'Team Channel' tab above to view live notes."
      },
      {
        title: "Tutorial Complete!",
        description: "Awesome job! You are ready to use MedNote.",
        instruction: "Click 'Finish' to start using your workspace."
      }
    ];

    function expandText(text) {
      if (!text) return "";
      let words = text.split(/\b/);
      return words.map(w => {
        let clean = w.toLowerCase().trim();
        if (state.dictionary[clean]) {
          let match = state.dictionary[clean];
          if (w[0] === w[0].toUpperCase() && w[0] !== w[0].toLowerCase()) {
            return match.charAt(0).toUpperCase() + match.slice(1);
          }
          return match;
        }
        return w;
      }).join("");
    }

    function render() {
      const appEl = document.getElementById("app");
      if (!state.currentUser) {
        appEl.innerHTML = renderLoginScreen();
        attachLoginEvents();
        return;
      }
      appEl.innerHTML = `
        ${renderHeader()}
        <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 gap-6">
          ${renderTabContent()}
        </main>
        ${renderFooter()}
      `;
      attachGlobalEvents();
    }

    function renderLoginScreen() {
      return `
        <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
          <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-6 md:p-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-blue-600 to-teal-400"></div>
            <div class="text-center mb-8">
              <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mb-4">
                <i class="fa-solid font-bold text-3xl fa-notes-medical"></i>
              </div>
              <h1 class="text-2xl font-bold text-slate-900">MedNote Access Portal</h1>
              <p class="text-slate-500 text-sm mt-1">Clinical shorthand & team collaboration</p>
            </div>

            <div class="space-y-4">
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Select Login Profile</label>
              <button id="btn-login-admin" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 transition duration-150 flex items-center group active:scale-95">
                <div class="w-10 h-10 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold mr-4">
                  <i class="fa-solid fa-hospital-user"></i>
                </div>
                <div class="flex-grow">
                  <div class="font-semibold text-slate-800">Establishment / Admin Login</div>
                  <div class="text-xs text-slate-500">Manage facility rules & staff accounts</div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-300"></i>
              </button>

              <button id="btn-login-worker" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:border-teal-500 hover:bg-teal-50/50 transition duration-150 flex items-center group active:scale-95">
                <div class="w-10 h-10 rounded-lg bg-teal-100 text-teal-600 flex items-center justify-center font-bold mr-4">
                  <i class="fa-solid fa-user-nurse"></i>
                </div>
                <div class="flex-grow">
                  <div class="font-semibold text-slate-800">Employee / Worker Login</div>
                  <div class="text-xs text-slate-500">Clinical notes & live team channel</div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-300"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function attachLoginEvents() {
      document.getElementById("btn-login-admin")?.addEventListener("click", () => {
        state.currentUser = { name: "Dr. Eleanor Vance (Director)", role: "admin", facility: "Metro General Hospital" };
        render();
      });
      document.getElementById("btn-login-worker")?.addEventListener("click", () => {
        state.currentUser = { name: "Sam Martinez, RN", role: "employee", facility: "Metro General Hospital - Ward 4" };
        render();
      });
    }

    function renderHeader() {
      return `
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
          <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md">
                <i class="fa-solid fa-notes-medical text-lg"></i>
              </div>
              <div>
                <span class="text-lg font-bold text-slate-900 tracking-tight">MedNote</span>
              </div>
            </div>

            <nav class="flex space-x-1 sm:space-x-2 overflow-x-auto custom-scrollbar">
              <button onclick="switchTab('workspace')" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${state.activeTab === 'workspace' ? 'bg-blue-50 text-blue-600' : 'text-slate-600'}">Workspace</button>
              <button onclick="switchTab('teamchat')" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${state.activeTab === 'teamchat' ? 'bg-blue-50 text-blue-600' : 'text-slate-600'}">Team Channel</button>
              <button onclick="switchTab('tutorial')" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${state.activeTab === 'tutorial' ? 'bg-blue-50 text-blue-600' : 'text-slate-600'}">Tutorial</button>
              <button onclick="switchTab('dictionary')" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${state.activeTab === 'dictionary' ? 'bg-blue-50 text-blue-600' : 'text-slate-600'}">Dictionary</button>
              ${state.currentUser.role === 'admin' ? `<button onclick="switchTab('admin')" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${state.activeTab === 'admin' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600'}">Admin</button>` : ''}
              <button onclick="logout()" class="px-2 py-2 text-xs text-rose-500 hover:bg-rose-50 rounded-lg"><i class="fa-solid fa-right-from-bracket"></i></button>
            </nav>
          </div>
        </header>
      `;
    }

    function renderTabContent() {
      switch (state.activeTab) {
        case 'teamchat': return renderTeamChatTab();
        case 'tutorial': return renderTutorialTab();
        case 'dictionary': return renderDictionaryTab();
        case 'admin': return renderAdminTab();
        case 'workspace':
        default: return renderWorkspaceTab();
      }
    }

    function renderWorkspaceTab() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                <i class="fa-solid fa-laptop-medical text-blue-600 mr-2"></i> Medical Notes Input
              </h2>
              <form id="note-form" class="space-y-4">
                <textarea id="note-input" rows="4" placeholder="e.g. 68yo male pt presented with sob and htn..." class="w-full p-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 text-slate-800 text-sm"></textarea>
                <div class="flex justify-end">
                  <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm active:scale-95">Expand Note</button>
                </div>
              </form>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <h3 class="text-sm font-bold uppercase text-slate-400 mb-2">Expanded Result</h3>
              <div id="expanded-result" class="p-4 bg-slate-50 rounded-xl border border-slate-200 min-h-[80px] text-sm">
                <span class="text-slate-400 italic">Result will appear here...</span>
              </div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h3 class="text-md font-bold text-slate-900 mb-4">Recent Notes</h3>
            <div class="space-y-3 max-h-[350px] overflow-y-auto custom-scrollbar">
              ${state.notesHistory.map(note => `
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                  <div class="font-semibold text-slate-600 mb-1">${note.author}</div>
                  <p class="text-slate-800">${note.expanded}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderTeamChatTab() {
      return `
        <div class="max-w-4xl mx-auto w-full space-y-6">
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="text-xl font-bold text-slate-900">Ward 4 Team Channel</h2>
            <p class="text-xs text-slate-500">Shared clinical shorthand channel</p>
          </div>

          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div id="chat-messages-container" class="space-y-4 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
              ${state.chatMessages.map(msg => {
                const isMe = msg.author === state.currentUser?.name;
                return `
                  <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                    <span class="text-[10px] text-slate-400 mb-0.5">${msg.author} •${msg.timestamp}</span>
                    <div class="max-w-lg rounded-2xl p-3.5 text-sm ${isMe ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-800'}">
                      <p class="font-medium">${msg.text}</p>
                      <div class="mt-1 pt-1 border-t opacity-80 text-xs">Expanded: ${expandText(msg.text)}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <form id="chat-form" class="flex gap-2 pt-2 border-t border-slate-100">
              <input type="text" id="chat-input" placeholder="Type shorthand message... (e.g. pt rx po bid)" required class="flex-grow p-3 border border-slate-300 rounded-xl text-sm" />
              <button type="submit" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-semibold text-sm active:scale-95">Send</button>
            </form>
          </div>
        </div>
      `;
    }

    function renderTutorialTab() {
      const step = TUTORIAL_STEPS[state.tutorialStep];
      return `
        <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center space-y-6">
          <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">${state.tutorialStep + 1}</div>
          <h2 class="text-2xl font-bold text-slate-900">${step.title}</h2>
          <p class="text-slate-600 text-sm leading-relaxed">${step.description}</p>
          <div class="p-4 bg-slate-50 rounded-xl text-xs text-slate-500 font-mono">${step.instruction}</div>

          <div class="flex justify-between pt-4">
            <button onclick="prevTutorialStep()" ${state.tutorialStep === 0 ? 'disabled class="opacity-30 cursor-not-allowed text-slate-400"' : 'class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-semibold"'}>Previous</button>
            ${state.tutorialStep < TUTORIAL_STEPS.length - 1 
              ? `<button onclick="nextTutorialStep()" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold">Next</button>`
              : `<button onclick="finishTutorial()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">Finish Tutorial</button>`
            }
          </div>
        </div>
      `;
    }

    function renderDictionaryTab() {
      const keys = Object.keys(state.dictionary).sort();
      return `
        <div class="max-w-4xl mx-auto w-full bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
          <h2 class="text-xl font-bold text-slate-900 mb-4">Clinical Terms Dictionary (${keys.length})</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[500px] overflow-y-auto custom-scrollbar">
            ${keys.map(k => `
              <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center text-sm">
                <span class="font-mono font-bold text-blue-600">${k}</span>
                <span class="text-slate-600">${state.dictionary[k]}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAdminTab() {
      return `
        <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <h2 class="text-xl font-bold text-slate-900">Facility Administration</h2>
          <form id="admin-add-form" class="space-y-3">
            <input type="text" id="admin-key" placeholder="Abbreviation (e.g. cap)" required class="w-full p-2.5 border rounded-lg text-sm" />
            <input type="text" id="admin-value" placeholder="Expansion (e.g. community acquired pneumonia)" required class="w-full p-2.5 border rounded-lg text-sm" />
            <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-semibold">Add Custom Term</button>
          </form>
        </div>
      `;
    }

    function renderFooter() {
      return `
        <footer class="bg-white border-t border-slate-200 py-3 mt-auto">
          <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">MedNote Mobile App &copy; 2026 HIPAA Compliant Workspace</div>
        </footer>
      `;
    }

    function attachGlobalEvents() {
      const noteForm = document.getElementById("note-form");
      if (noteForm) {
        noteForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const input = document.getElementById("note-input").value.trim();
          if (!input) return;
          const expanded = expandText(input);
          document.getElementById("expanded-result").innerText = expanded;
          state.notesHistory.unshift({ id: Date.now(), author: state.currentUser.name, expanded });
        });
      }

      const chatForm = document.getElementById("chat-form");
      if (chatForm) {
        chatForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const chatInput = document.getElementById("chat-input").value.trim();
          if (!chatInput) return;
          state.chatMessages.push({
            id: Date.now(),
            author: state.currentUser.name,
            text: chatInput,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          render();
        });
      }

      const adminForm = document.getElementById("admin-add-form");
      if (adminForm) {
        adminForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const k = document.getElementById("admin-key").value.trim().toLowerCase();
          const v = document.getElementById("admin-value").value.trim();
          if (k && v) {
            state.dictionary[k] = v;
            alert(`Added shorthand: ${k} -> ${v}`);
            render();
          }
        });
      }
    }

    function switchTab(t) { state.activeTab = t; render(); }
    function logout() { state.currentUser = null; render(); }
    function prevTutorialStep() { if (state.tutorialStep > 0) { state.tutorialStep--; render(); } }
    function nextTutorialStep() { if (state.tutorialStep < TUTORIAL_STEPS.length - 1) { state.tutorialStep++; render(); } }
    function finishTutorial() { state.activeTab = 'workspace'; render(); }

    window.onload = function() { render(); };
  </script>
</body>
</html>
