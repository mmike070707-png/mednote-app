    function expandText(text) {
      if (!text) return "";
      let words = text.split(/\b/);
      return words.map(w => {
        let clean = w.toLowerCase().trim();
        if (state.dictionary[clean]) {
          let match = state.dictionary[clean];
          // Preserve capitalized first letter if user entered capitalized term
          if (w[0] === w[0].toUpperCase() && w[0] !== w[0].toLowerCase()) {
            return match.charAt(0).toUpperCase() + match.slice(1);
          }
          return match;
        }
        return w;
      }).join("");
    }

  <script>

    function attachGlobalEvents() {
      // Workspace Note Form Submission
      const noteForm = document.getElementById("note-form");
      if (noteForm) {
        noteForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const input = document.getElementById("note-input").value.trim();
          if (!input) return;

          // Check for special commands
          if (input === ":list") {
            switchTab('dictionary');
            return;
          }

          if (input.startsWith(":search ")) {
            const query = input.replace(":search ", "").toLowerCase().trim();
            const result = state.dictionary[query] 
              ? `Found term '${query}': ${state.dictionary[query]}`
              : `No abbreviation matching '${query}' found.`;
            document.getElementById("expanded-result").innerHTML = `<span class="text-blue-600 font-semibold">${result}</span>`;
            return;
          }

          if (input.startsWith(":add ")) {
            const parts = input.replace(":add ", "").split(" ");
            if (parts.length >= 2) {
              const key = parts[0].toLowerCase();
              const val = parts.slice(1).join(" ");
              state.dictionary[key] = val;
              document.getElementById("expanded-result").innerHTML = `<span class="text-emerald-600 font-semibold">Added new term: '${key}' -> '${val}'</span>`;
              return;
            }
          }

          // Regular expansion logic
          const expanded = expandText(input);
          document.getElementById("expanded-result").innerText = expanded;

          // Add to recent history
          state.notesHistory.unshift({
            id: Date.now(),
            original: input,
            expanded: expanded,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            author: state.currentUser.name
          });
        });
      }

      // Shared Team Channel Chat Submission
      const chatForm = document.getElementById("chat-form");
      if (chatForm) {
        chatForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const chatInput = document.getElementById("chat-input").value.trim();
          if (!chatInput) return;

          state.chatMessages.push({
            id: Date.now(),
            author: state.currentUser.name,
            role: state.currentUser.role,
            text: chatInput,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            showExpanded: false
          });

          render();
          
          // Auto scroll to bottom of chat
          setTimeout(() => {
            const container = document.getElementById("chat-messages-container");
            if (container) container.scrollTop = container.scrollHeight;
          }, 50);
        });
      }

      // Interactive Tutorial Form Submission
      const tutForm = document.getElementById("tutorial-form");
      if (tutForm) {
        tutForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const tutInput = document.getElementById("tutorial-input").value.trim();
          const outputEl = document.getElementById("tutorial-output");
          const step = TUTORIAL_STEPS[state.tutorialStep];

          if (!tutInput) return;

          if (tutInput === ":list") {
            outputEl.innerHTML = `<div class="text-amber-400">> System Dictionary Keys: ${Object.keys(state.dictionary).join(", ")}</div>`;
          } else if (tutInput.startsWith(":search ")) {
            const term = tutInput.replace(":search ", "").trim().toLowerCase();
            if (state.dictionary[term]) {
              outputEl.innerHTML = `<div class="text-emerald-400">> Found: '${term}' = "${state.dictionary[term]}"</div>`;
            } else {
              outputEl.innerHTML = `<div class="text-rose-400">> Term '${term}' not found in dictionary.</div>`;
            }
          } else if (tutInput.startsWith(":add ")) {
            const parts = tutInput.replace(":add ", "").split(" ");
            if (parts.length >= 2) {
              const key = parts[0].toLowerCase();
              const val = parts.slice(1).join(" ");
              state.dictionary[key] = val;
              outputEl.innerHTML = `<div class="text-emerald-400">> Added shorthand '${key}' = "${val}"</div>`;
            }
          } else {
            const expanded = expandText(tutInput);
            outputEl.innerHTML = `<div class="text-white">> Expanded: "${expanded}"</div>`;
          }

          document.getElementById("tutorial-input").value = "";
        });
      }

      // Admin Add Form
      const adminForm = document.getElementById("admin-add-form");
      if (adminForm) {
        adminForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const key = document.getElementById("admin-key").value.trim().toLowerCase();
          const val = document.getElementById("admin-value").value.trim();
          if (key && val) {
            state.dictionary[key] = val;
            alert(`Successfully registered '${key}' -> '${val}'`);
            render();
          }
        });
      }
    }

    function switchTab(tab) {
      state.activeTab = tab;
      render();
    }

    function logout() {
      state.currentUser = null;
      render();
    }

    function prevTutorialStep() {
      if (state.tutorialStep > 0) {
        state.tutorialStep--;
        render();
      }
    }

    function nextTutorialStep() {
      if (state.tutorialStep < TUTORIAL_STEPS.length - 1) {
        state.tutorialStep++;
        render();
      }
    }

    function finishTutorial() {
      state.activeTab = 'workspace';
      render();
    }

    function filterDictionary(query) {
      const q = query.toLowerCase().trim();
      const body = document.getElementById("dict-table-body");
      if (!body) return;

      const keys = Object.keys(state.dictionary).sort();
      const filtered = keys.filter(k => k.includes(q) || state.dictionary[k].toLowerCase().includes(q));

      body.innerHTML = filtered.map(key => `
        <tr class="hover:bg-slate-50/50 transition">
          <td class="px-6 py-3 font-mono font-semibold text-blue-600">${key}</td>
          <td class="px-6 py-3 text-slate-700">${state.dictionary[key]}</td>
        </tr>
      `).join('');
    }

    function copyExpandedNote() {
      const res = document.getElementById("expanded-result")?.innerText;
      if (res) {
        navigator.clipboard.writeText(res);
        alert("Copied expanded note to clipboard!");
      }
    }

    // Initialize application on page load
    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
