cat << 'EOF' > ~/mednote/index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="description" content="MedNote - High-Precision Clinical Shorthand Expansion, Shared Team Communication, and Training Hub." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MedNote" />
  
  <title>MedNote - Clinical Portal & Shorthand Hub</title>
  
  <link rel="manifest" id="manifest-placeholder" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .sanitized-grid {
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 28px 28px;
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.96); }
    }
    .pulse-live {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 min-h-screen flex flex-col antialiased select-none sanitized-grid">

  <div id="app" class="flex-grow flex flex-col min-h-screen"></div>

  <script>
    const manifestData = {
      "name": "MedNote Clinical Hub",
      "short_name": "MedNote",
      "description": "Clinical Shorthand Expansion & Team Communication App",
      "start_url": "/",
      "display": "standalone",
      "background_color": "#f8fafc",
      "theme_color": "#0284c7",
      "icons": [
        {
          "src": "https://cdn-icons-png.flaticon.com/512/3063/3063176.png",
          "sizes": "192x192",
          "type": "image/png"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blobManifest = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blobManifest);
    document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);

    const DEFAULT_DICT = {
      "pt": "patient",
      "htn": "hypertension",
      "dm2": "type 2 diabetes mellitus",
      "dm1": "type 1 diabetes mellitus",
      "sob": "shortness of breath",
      "po": "orally (by mouth)",
      "bid": "twice a day",
      "tid": "three times a day",
      "qid": "four times a day",
      "qd": "once daily",
      "prn": "as needed",
      "ekg": "electrocardiogram",
      "chf": "congestive heart failure",
      "copd": "chronic obstructive pulmonary disease",
      "rx": "prescription",
      "dx": "diagnosis",
      "hx": "history",
      "tx": "treatment",
      "stat": "immediately",
      "bp": "blood pressure",
      "hr": "heart rate",
      "icu": "intensive care unit",
      "er": "emergency room",
      "iv": "intravenous",
      "npo": "nothing by mouth"
    };

    let state = {
      currentUser: null,
      activeTab: 'workspace',
      dictionary: { ...DEFAULT_DICT },
      notesHistory: [
        { id: 1, original: "72yo pt presenting to ER w/ sob, htn, and hx of chf. Start IV prn.", expanded: "72yo patient presenting to emergency room w/ shortness of breath, hypertension, and history of congestive heart failure. Start intravenous as needed.", timestamp: "10:15 AM", author: "Dr. Alex Vance", status: "Verified" },
        { id: 2, original: "Administer rx po bid for dm2. Monitor bp stat.", expanded: "Administer prescription orally (by mouth) twice a day for type 2 diabetes mellitus. Monitor blood pressure immediately.", timestamp: "11:30 AM", author: "Nurse Sarah Jenkins", status: "Logged" }
      ],
      chatMessages: [
        {
          id: 101,
          author: "Dr. Eleanor Vance",
          role: "Director of Emergency Medicine",
          text: "Attention team: 72yo pt in Bed 4 presenting w/ severe sob & htn. Please run ekg stat.",
          timestamp: "12:04 PM",
          badge: "MD"
        },
        {
          id: 102,
          author: "Sam Martinez",
          role: "Charge Nurse",
          text: "Copy Dr. Vance. Starting IV and administering rx po bid prn. Will monitor bp closely.",
          timestamp: "12:07 PM",
          badge: "RN"
        }
      ],
      tutorialStep: 0,
      copiedTooltip: false
    };

    const TUTORIAL_STEPS = [
      {
        title: "Welcome to MedNote Clinical Hub",
        description: "Engineered for high-volume clinical workflows. MedNote instantly expands standardized clinical shorthand into clear, unambiguous, HIPAA-compliant notes.",
        instruction: "Click 'Next Step' below to learn how to navigate the workspace."
      },
      {
        title: "1. Instant Expansion Workspace",
        description: "Input shorthand tokens directly into the expansion desk. Try pasting: <code class='bg-sky-100 text-sky-900 border border-sky-200 px-2 py-0.5 rounded font-mono text-xs'>pt with htn and dm2 presenting w/ sob</code>",
        instruction: "Click 'Expand Note' to test real-time shorthand translation."
      },
      {
        title: "2. Real-Time Team Channel",
        description: "Communicate with ward staff using built-in clinical auto-translation to eliminate misinterpretation during critical handoffs.",
        instruction: "Switch tabs via the top header bar to test the live team stream."
      },
      {
        title: "Ready to Start!",
        description: "You're set to process high-speed, zero-error medical documentation.",
        instruction: "Click 'Launch Workspace' to begin recording notes."
      }
    ];

    function expandText(text) {
      if (!text) return "";
      let words = text.split(/\b/);
      return words.map(w => {
        let clean = w.toLowerCase().trim();
        if (state.dictionary[clean]) {
          let match = state.dictionary[clean];
          if (w[0] === w[0].toUpperCase() && w[0] !== w[0].toLowerCase()) {
            return match.charAt(0).toUpperCase() + match.slice(1);
          }
          return match;
        }
        return w;
      }).join("");
    }

    function render() {
      const appEl = document.getElementById("app");
      
      if (!state.currentUser) {
        appEl.innerHTML = renderLoginScreen();
        attachLoginEvents();
        return;
      }

      appEl.innerHTML = `
        ${renderHeader()}
        <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8 flex flex-col">
          ${renderTabContent()}
        </main>
        ${renderFooter()}
      `;

      attachGlobalEvents();
    }

    function renderLoginScreen() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-sky-950 flex items-center justify-center p-4 sm:p-6">
          <div class="max-w-md w-full glass-card rounded-3xl shadow-2xl border border-white/20 overflow-hidden relative">
            <div class="h-2 bg-gradient-to-r from-sky-500 via-teal-400 to-emerald-400"></div>
            
            <div class="p-8">
              <div class="flex flex-col items-center text-center mb-8">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-600 to-teal-500 text-white flex items-center justify-center shadow-lg shadow-sky-500/30 mb-4 ring-8 ring-sky-50/50">
                  <i class="fa-solid fa-staff-snake text-3xl"></i>
                </div>
                <div class="inline-flex items-center space-x-2 bg-sky-50 border border-sky-200/80 px-3 py-1 rounded-full text-xs font-semibold text-sky-800 mb-2">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 pulse-live"></span>
                  <span>System Active • HD Grade v2.6</span>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">MedNote Portal</h1>
                <p class="text-slate-500 text-xs mt-1">High-Precision Clinical Documentation Hub</p>
              </div>

              <div class="space-y-3.5">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Select Login Profile</label>
                
                <button id="btn-login-admin" class="w-full text-left p-4 rounded-2xl border border-slate-200 bg-white/90 hover:border-sky-500 hover:bg-sky-50/60 transition-all duration-200 flex items-center justify-between group shadow-sm hover:shadow-md active:scale-[0.99]">
                  <div class="flex items-center space-x-4">
                    <div class="w-11 h-11 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center font-bold text-lg group-hover:bg-sky-600 group-hover:text-white transition-colors duration-200">
                      <i class="fa-solid fa-user-doctor"></i>
                    </div>
                    <div>
                      <div class="font-bold text-slate-800 text-sm">Attending Physician / Director</div>
                      <div class="text-xs text-slate-500">Dictionary management & full system access</div>
                    </div>
                  </div>
                  <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-sky-600 group-hover:translate-x-1 transition-all"></i>
                </button>

                <button id="btn-login-worker" class="w-full text-left p-4 rounded-2xl border border-slate-200 bg-white/90 hover:border-teal-500 hover:bg-teal-50/60 transition-all duration-200 flex items-center justify-between group shadow-sm hover:shadow-md active:scale-[0.99]">
                  <div class="flex items-center space-x-4">
                    <div class="w-11 h-11 rounded-xl bg-teal-100 text-teal-600 flex items-center justify-center font-bold text-lg group-hover:bg-teal-600 group-hover:text-white transition-colors duration-200">
                      <i class="fa-solid fa-user-nurse"></i>
                    </div>
                    <div>
                      <div class="font-bold text-slate-800 text-sm">Clinical Practitioner (RN)</div>
                      <div class="text-xs text-slate-500">Shorthand expansion & team live channel</div>
                    </div>
                  </div>
                  <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-teal-600 group-hover:translate-x-1 transition-all"></i>
                </button>
              </div>

              <div class="mt-8 pt-6 border-t border-slate-200/60 text-center">
                <p class="text-[11px] text-slate-400 flex items-center justify-center space-x-1.5">
                  <i class="fa-solid fa-shield-halved text-emerald-500"></i>
                  <span>256-Bit Encrypted Clinical Session</span>
                </p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function attachLoginEvents() {
      document.getElementById("btn-login-admin")?.addEventListener("click", () => {
        state.currentUser = { name: "Dr. Eleanor Vance", role: "admin", title: "Director of Emergency Medicine", facility: "Metro General Hospital" };
        render();
      });

      document.getElementById("btn-login-worker")?.addEventListener("click", () => {
        state.currentUser = { name: "Sam Martinez", role: "employee", title: "Charge Nurse (RN)", facility: "Metro General Hospital • Ward 4" };
        render();
      });
    }

    function renderHeader() {
      return `
        <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-teal-500 text-white flex items-center justify-center shadow-md shadow-sky-500/20">
                <i class="fa-solid fa-staff-snake text-xl"></i>
              </div>
              <div>
                <div class="flex items-center space-x-2">
                  <span class="text-lg font-extrabold text-slate-900 tracking-tight">MedNote</span>
                  <span class="bg-sky-100 text-sky-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase border border-sky-200">Clinical Hub</span>
                </div>
                <div class="text-[11px] text-slate-400 hidden sm:block">${state.currentUser.facility}</div>
              </div>
            </div>

            <nav class="flex items-center space-x-1 sm:space-x-2 bg-slate-100/90 p-1 rounded-xl border border-slate-200/70">
              <button onclick="switchTab('workspace')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center space-x-1.5 ${state.activeTab === 'workspace' ? 'bg-white text-sky-700 shadow-sm border border-slate-200/60' : 'text-slate-600 hover:text-slate-900'}">
                <i class="fa-solid fa-pen-to-square text-xs"></i>
                <span class="hidden md:inline">Workspace</span>
              </button>
              
              <button onclick="switchTab('teamchat')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center space-x-1.5 ${state.activeTab === 'teamchat' ? 'bg-white text-sky-700 shadow-sm border border-slate-200/60' : 'text-slate-600 hover:text-slate-900'}">
                <i class="fa-solid fa-comments text-xs"></i>
                <span class="hidden md:inline">Team Channel</span>
              </button>

              <button onclick="switchTab('dictionary')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center space-x-1.5 ${state.activeTab === 'dictionary' ? 'bg-white text-sky-700 shadow-sm border border-slate-200/60' : 'text-slate-600 hover:text-slate-900'}">
                <i class="fa-solid fa-book-medical text-xs"></i>
                <span class="hidden md:inline">Dictionary</span>
              </button>

              <button onclick="switchTab('tutorial')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center space-x-1.5 ${state.activeTab === 'tutorial' ? 'bg-white text-sky-700 shadow-sm border border-slate-200/60' : 'text-slate-600 hover:text-slate-900'}">
                <i class="fa-solid fa-graduation-cap text-xs"></i>
                <span class="hidden md:inline">Tutorial</span>
              </button>

              ${state.currentUser.role === 'admin' ? `
                <button onclick="switchTab('admin')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center space-x-1.5 ${state.activeTab === 'admin' ? 'bg-indigo-600 text-white shadow-sm' : 'text-indigo-600 hover:bg-indigo-50'}">
                  <i class="fa-solid fa-sliders text-xs"></i>
                  <span class="hidden md:inline">Admin</span>
                </button>
              ` : ''}
            </nav>

            <div class="flex items-center space-x-3 border-l border-slate-200 pl-4">
              <div class="text-right hidden xl:block">
                <div class="text-xs font-bold text-slate-800">${state.currentUser.name}</div>
                <div class="text-[10px] text-slate-400">${state.currentUser.title}</div>
              </div>
              <button onclick="logout()" title="Sign Out" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 flex items-center justify-center transition duration-150 border border-slate-200">
                <i class="fa-solid fa-power-off text-sm"></i>
              </button>
            </div>
          </div>
        </header>
      `;
    }

    function renderTabContent() {
      switch (state.activeTab) {
        case 'teamchat': return renderTeamChatTab();
        case 'tutorial': return renderTutorialTab();
        case 'dictionary': return renderDictionaryTab();
        case 'admin': return renderAdminTab();
        case 'workspace':
        default: return renderWorkspaceTab();
      }
    }

    function renderWorkspaceTab() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
          <div class="lg:col-span-2 space-y-6 flex flex-col">
            <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm overflow-hidden flex-grow flex flex-col">
              <div class="bg-slate-50/80 px-6 py-4 border-b border-slate-200/80 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                  <span class="w-3 h-3 rounded-full bg-sky-500"></span>
                  <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wide">Live Note Expansion Desk</h2>
                </div>
                <span class="text-xs text-slate-400 font-mono">Auto-Format Active</span>
              </div>

              <div class="p-6 flex-grow flex flex-col space-y-6">
                <form id="note-form" class="flex flex-col flex-grow space-y-4">
                  <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
                      Clinical Shorthand Input
                    </label>
                    <textarea id="note-input" rows="5" 
                      placeholder="e.g. 68yo male pt presented with sob and htn. Administer rx po bid prn..."
                      class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-slate-800 text-sm font-mono-code transition duration-200 outline-none resize-none shadow-inner"
                    ></textarea>
                  </div>

                  <div class="flex items-center justify-between pt-2">
                    <div class="flex items-center space-x-2 text-xs text-slate-400">
                      <i class="fa-solid fa-circle-info text-sky-500"></i>
                      <span>Tokens automatically convert to standardized full text</span>
                    </div>
                    <button type="submit" class="bg-gradient-to-r from-sky-600 to-teal-600 hover:from-sky-700 hover:to-teal-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-md shadow-sky-600/20 active:scale-95 transition duration-150 flex items-center space-x-2">
                      <i class="fa-solid fa-wand-magic-sparkles"></i>
                      <span>Expand Note</span>
                    </button>
                  </div>
                </form>

                <div class="pt-4 border-t border-slate-100">
                  <div class="flex items-center justify-between mb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Expanded Clinical Standard Text</h3>
                    <button id="copy-result-btn" class="text-xs text-sky-600 hover:text-sky-700 font-semibold flex items-center space-x-1 px-2.5 py-1 bg-sky-50 rounded-lg hover:bg-sky-100 transition">
                      <i class="fa-regular fa-copy"></i>
                      <span>Copy Result</span>
                    </button>
                  </div>
                  <div id="expanded-result" class="p-4 bg-sky-50/40 rounded-xl border border-sky-100 min-h-[100px] text-sm text-slate-800 leading-relaxed font-sans">
                    <span class="text-slate-400 italic">Expanded full text will appear here immediately after processing...</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-6 flex flex-col">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
              <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wide flex items-center space-x-2">
                <i class="fa-solid fa-clock-rotate-left text-sky-600"></i>
                <span>Recent Note Logs</span>
              </h3>
              <span class="text-[11px] font-bold bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full">${state.notesHistory.length} Recorded</span>
            </div>

            <div class="space-y-3 overflow-y-auto max-h-[500px] custom-scrollbar pr-1 flex-grow">
              ${state.notesHistory.map(note => `
                <div class="p-4 bg-slate-50 hover:bg-sky-50/30 rounded-xl border border-slate-200/80 transition duration-150 space-y-2">
                  <div class="flex items-center justify-between text-[11px]">
                    <span class="font-bold text-slate-700">${note.author}</span>
                    <span class="text-slate-400 font-mono">${note.timestamp || 'Just Now'}</span>
                  </div>
                  <p class="text-xs text-slate-700 leading-relaxed font-normal">${note.expanded}</p>
                  <div class="flex items-center justify-between pt-1 border-t border-slate-200/40 text-[10px]">
                    <span class="inline-flex items-center space-x-1 text-emerald-600 font-medium">
                      <i class="fa-solid fa-check-double"></i>
                      <span>${note.status || 'Verified'}</span>
                    </span>
                    <button onclick="copyToClipboard('${note.expanded.replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-sky-600 font-medium">
                      Copy
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderTeamChatTab() {
      return `
        <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col space-y-4">
          <div class="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-teal-500/10 text-teal-600 flex items-center justify-center font-bold text-lg">
                <i class="fa-solid fa-user-group"></i>
              </div>
              <div>
                <h2 class="text-base font-bold text-slate-900">Ward 4 Emergency Communication Channel</h2>
                <p class="text-xs text-slate-400">Encrypted clinical dialogue w/ auto-translation</p>
              </div>
            </div>
            <div class="flex items-center space-x-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-live"></span>
              <span class="text-xs font-semibold text-slate-600">4 Staff Active</span>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-6 flex-grow flex flex-col justify-between space-y-4">
            <div id="chat-messages-container" class="space-y-4 max-h-[450px] overflow-y-auto custom-scrollbar pr-2 flex-grow">
              ${state.chatMessages.map(msg => {
                const isMe = msg.author === state.currentUser?.name;
                const expanded = expandText(msg.text);
                return `
                  <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1">
                    <div class="flex items-center space-x-2 text-[11px] text-slate-400 px-1">
                      <span class="font-bold text-slate-700">${msg.author}</span>
                      <span class="bg-slate-100 text-slate-600 font-semibold px-1.5 py-0.2 rounded text-[10px]">${msg.badge || 'Staff'}</span>
                      <span>• ${msg.timestamp}</span>
                    </div>
                    
                    <div class="max-w-lg rounded-2xl p-4 shadow-sm ${isMe ? 'bg-gradient-to-r from-sky-600 to-sky-700 text-white rounded-br-none' : 'bg-slate-100 text-slate-800 rounded-bl-none border border-slate-200/60'}">
                      <p class="font-mono-code text-xs font-medium">${msg.text}</p>
                      
                      <div class="mt-2 pt-2 ${isMe ? 'border-t border-sky-500/60 text-sky-100' : 'border-t border-slate-200 text-slate-600'} text-xs">
                        <span class="font-semibold text-[10px] uppercase tracking-wider block opacity-75 mb-0.5">Expanded Translation:</span>
                        <p class="font-sans leading-relaxed">${expanded}</p>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <form id="chat-form" class="pt-3 border-t border-slate-100 flex items-center space-x-3">
              <input type="text" id="chat-input" placeholder="Type clinical shorthand (e.g. 72yo pt presenting w/ sob)..." required
                class="flex-grow p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono-code focus:bg-white focus:ring-2 focus:ring-sky-500 outline-none transition" />
              <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-3 rounded-xl font-bold text-xs shadow-md shadow-sky-600/20 active:scale-95 transition flex items-center space-x-2">
                <span>Send</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function renderTutorialTab() {
      const step = TUTORIAL_STEPS[state.tutorialStep];
      return `
        <div class="max-w-2xl mx-auto my-auto bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/90 shadow-xl text-center space-y-6">
          <div class="w-20 h-20 bg-gradient-to-tr from-sky-500 to-teal-400 text-white rounded-3xl flex items-center justify-center mx-auto text-3xl font-bold shadow-lg shadow-sky-500/20 ring-8 ring-sky-50">
            ${state.tutorialStep + 1}
          </div>

          <div class="space-y-2">
            <h2 class="text-2xl font-extrabold text-slate-900">${step.title}</h2>
            <p class="text-slate-600 text-sm leading-relaxed max-w-lg mx-auto">${step.description}</p>
          </div>

          <div class="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl text-xs text-slate-600 font-mono-code">
            ${step.instruction}
          </div>

          <div class="flex items-center justify-between pt-6 border-t border-slate-100">
            <button onclick="prevTutorialStep()" ${state.tutorialStep === 0 ? 'disabled class="opacity-40 cursor-not-allowed text-slate-400"' : 'class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-700 transition"'}>
              Previous
            </button>
            
            <div class="flex space-x-1.5">
              ${TUTORIAL_STEPS.map((_, idx) => `
                <span class="w-2.5 h-2.5 rounded-full transition-all duration-300 ${idx === state.tutorialStep ? 'bg-sky-600 w-6' : 'bg-slate-200'}"></span>
              `).join('')}
            </div>

            ${state.tutorialStep < TUTORIAL_STEPS.length - 1 
              ? `<button onclick="nextTutorialStep()" class="px-6 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold shadow-md transition">Next Step</button>`
              : `<button onclick="finishTutorial()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition">Launch Workspace</button>`
            }
          </div>
        </div>
      `;
    }

    function renderDictionaryTab() {
      const keys = Object.keys(state.dictionary).sort();
      return `
        <div class="max-w-5xl mx-auto w-full bg-white p-6 sm:p-8 rounded-2xl border border-slate-200/90 shadow-sm space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900">Standardized Medical Shorthand Index</h2>
              <p class="text-xs text-slate-500 mt-0.5">Active facility-wide shorthand expansions (${keys.length} defined tokens)</p>
            </div>
            <div class="relative">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-400"></i>
              <input type="text" id="dict-search" placeholder="Filter terms..." onkeyup="filterDictionary(this.value)"
                class="pl-8 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-500 outline-none w-full sm:w-64" />
            </div>
          </div>

          <div id="dict-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[550px] overflow-y-auto custom-scrollbar pr-1">
            ${keys.map(k => `
              <div class="dict-card p-3.5 bg-slate-50 hover:bg-sky-50/40 border border-slate-200/70 rounded-xl flex items-center justify-between transition">
                <span class="font-mono-code font-bold text-sky-700 text-xs bg-sky-100/70 px-2 py-1 rounded border border-sky-200/60">${k}</span>
                <span class="text-xs text-slate-700 font-medium text-right capitalize">${state.dictionary[k]}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAdminTab() {
      return `
        <div class="max-w-2xl mx-auto my-auto w-full bg-white p-8 rounded-3xl border border-slate-200/90 shadow-xl space-y-6">
          <div class="flex items-center space-x-3 pb-4 border-b border-slate-100">
            <div class="w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xl">
              <i class="fa-solid fa-sliders"></i>
            </div>
            <div>
              <h2 class="text-lg font-bold text-slate-900">Facility Terminology Administration</h2>
              <p class="text-xs text-slate-500">Add or modify shorthand tokens across the organization</p>
            </div>
          </div>

          <form id="admin-add-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">New Abbreviation Token</label>
              <input type="text" id="admin-key" placeholder="e.g. cap" required 
                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono-code focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Full Clinical Expansion</label>
              <input type="text" id="admin-value" placeholder="e.g. community acquired pneumonia" required 
                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-xs font-bold shadow-md shadow-indigo-600/20 active:scale-95 transition">
              Commit Term to Facility Dictionary
            </button>
          </form>
        </div>
      `;
    }

    function renderFooter() {
      return `
        <footer class="bg-white border-t border-slate-200/80 py-3 mt-auto">
          <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-2">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span>MedNote Clinical Hub &copy; 2026 HIPAA Compliant Workspace</span>
            </div>
            <div class="flex space-x-4">
              <span>Security Standard: AES-256</span>
              <span>Server: Local Ward 4 Node</span>
            </div>
          </div>
        </footer>
      `;
    }

    function attachGlobalEvents() {
      const noteForm = document.getElementById("note-form");
      if (noteForm) {
        noteForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const input = document.getElementById("note-input").value.trim();
          if (!input) return;

          const expanded = expandText(input);
          document.getElementById("expanded-result").innerText = expanded;
          
          state.notesHistory.unshift({
            id: Date.now(),
            author: state.currentUser.name,
            expanded,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            status: "Logged"
          });
        });
      }

      const copyBtn = document.getElementById("copy-result-btn");
      if (copyBtn) {
        copyBtn.addEventListener("click", () => {
          const text = document.getElementById("expanded-result").innerText;
          if (text && !text.includes("Expanded full text will appear")) {
            copyToClipboard(text);
          }
        });
      }

      const chatForm = document.getElementById("chat-form");
      if (chatForm) {
        chatForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const chatInput = document.getElementById("chat-input").value.trim();
          if (!chatInput) return;

          state.chatMessages.push({
            id: Date.now(),
            author: state.currentUser.name,
            badge: state.currentUser.role === 'admin' ? 'MD' : 'RN',
            text: chatInput,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });

          render();
          const chatContainer = document.getElementById("chat-messages-container");
          if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
        });
      }

      const adminForm = document.getElementById("admin-add-form");
      if (adminForm) {
        adminForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const k = document.getElementById("admin-key").value.trim().toLowerCase();
          const v = document.getElementById("admin-value").value.trim();
          if (k && v) {
            state.dictionary[k] = v;
            alert(`Dictionary updated: "${k}" now expands to "${v}"`);
            render();
          }
        });
      }
    }

    function filterDictionary(query) {
      const q = query.toLowerCase();
      const cards = document.querySelectorAll('.dict-card');
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    function copyToClipboard(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      document.body.removeChild(textarea);

      const copyBtn = document.getElementById("copy-result-btn");
      if (copyBtn) {
        copyBtn.innerHTML = `<i class="fa-solid fa-check text-emerald-600"></i><span class="text-emerald-600">Copied!</span>`;
        setTimeout(() => {
          copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i><span>Copy Result</span>`;
        }, 1500);
      }
    }

    function switchTab(t) { state.activeTab = t; render(); }
    function logout() { state.currentUser = null; render(); }
    function prevTutorialStep() { if (state.tutorialStep > 0) { state.tutorialStep--; render(); } }
    function nextTutorialStep() { if (state.tutorialStep < TUTORIAL_STEPS.length - 1) { state.tutorialStep++; render(); } }
    function finishTutorial() { state.activeTab = 'workspace'; render(); }

    window.onload = function() { render(); };
  </script>
</body>
</html>
